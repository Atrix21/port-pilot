name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what PortPilot did instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PortPilot version
      description: Settings (Ctrl+,) shows it at the bottom.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` if unsure.
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Installer
        - Portable exe
        - Built from source
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings → Open logs. Paste the relevant lines from today's file (they contain process names and paths from your machine — remove anything you'd rather not share).
      render: json
