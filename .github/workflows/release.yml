name: Release

# Push a tag like v1.0.1 and this builds, tests and publishes a GitHub Release with the
# installer, the portable exe and SHA-256 checksums. Each exe also gets a signed build-provenance
# attestation, so anyone can verify it was built here from this repository:
#   gh attestation verify PortPilot-1.0.0-Setup.exe --repo Atrix21/port-pilot
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build, test and package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./build.ps1 -Version $version
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "artifacts/installer/PortPilot-$env:VERSION-Setup.exe" dist/
          Copy-Item "artifacts/portable/PortPilot-$env:VERSION-portable.exe" dist/
          Push-Location dist
          Get-ChildItem *.exe | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = ".github/release-notes/${{ github.ref_name }}.md"
          $notesArgs = if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          gh release create '${{ github.ref_name }}' dist/* --title "PortPilot $env:VERSION" @notesArgs

  # Native Linux builds of the desktop and terminal apps, attached to the release created above.
  linux:
    needs: release
    strategy:
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test and publish
        run: |
          version='${{ github.ref_name }}'
          version="${version#v}"
          dotnet test tests/PortPilot.Core.Tests -c Release
          name="portpilot-$version-${{ matrix.rid }}"
          dotnet publish src/PortPilot.Cli -c Release -r ${{ matrix.rid }} -p:Version=$version -o "out/$name"
          dotnet publish src/PortPilot.Desktop -c Release -r ${{ matrix.rid }} -p:Version=$version -o "out/$name"
          cp packaging/linux/install.sh packaging/linux/portpilot.desktop "out/$name/"
          cp docs/PortPilot-512.png "out/$name/portpilot.png"
          mkdir dist
          tar -C out -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum *.tar.gz > "SHA256SUMS-${{ matrix.rid }}.txt")

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' dist/*

  # PortPilot.app (desktop + terminal app) for Apple silicon and Intel Macs.
  macos:
    needs: release
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test, publish and bundle
        run: |
          version='${{ github.ref_name }}'
          version="${version#v}"
          dotnet test tests/PortPilot.Core.Tests -c Release
          dotnet publish src/PortPilot.Cli -c Release -r ${{ matrix.rid }} -p:Version=$version -o out
          dotnet publish src/PortPilot.Desktop -c Release -r ${{ matrix.rid }} -p:Version=$version -o out
          packaging/macos/make-app.sh out "$version" ${{ matrix.rid }} dist
          (cd dist && shasum -a 256 *.zip > "SHA256SUMS-${{ matrix.rid }}.txt")

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' dist/*.zip dist/*.txt

  # Point the Homebrew cask at the new release.
  homebrew:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Update Casks/portpilot.rb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ github.ref_name }}'
          version="${version#v}"
          gh release download '${{ github.ref_name }}' --pattern 'SHA256SUMS-osx-*.txt'
          arm=$(awk '{print $1}' SHA256SUMS-osx-arm64.txt)
          intel=$(awk '{print $1}' SHA256SUMS-osx-x64.txt)
          python3 - "$version" "$arm" "$intel" <<'PY'
          import re, sys
          version, arm, intel = sys.argv[1:]
          path = "Casks/portpilot.rb"
          s = open(path).read()
          s = re.sub(r'version "[^"]+"', f'version "{version}"', s)
          s = re.sub(r'sha256 arm:\s+"[0-9a-f]+",\s+intel: "[0-9a-f]+"', f'sha256 arm:   "{arm}",\n         intel: "{intel}"', s)
          open(path, "w").write(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/portpilot.rb
          git diff --cached --quiet || (git commit -m "Homebrew: PortPilot $version" && git push)

  # VS Code / Cursor / Windsurf / VSCodium extension. Started as its own run (not workflow_call) so the
  # Marketplace's Trusted Publishing policy, which names vscode-extension.yml, matches the OIDC token.
  vscode-extension:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the extension workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_name }}'
          gh workflow run vscode-extension.yml --repo '${{ github.repository }}' --ref main -f version="${tag#v}" -f release-tag="$tag"

  # IntelliJ IDEA, WebStorm, PyCharm, GoLand, Rider, … (one plugin for all of them).
  jetbrains-plugin:
    needs: release
    runs-on: ubuntu-latest
    env:
      JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        working-directory: extensions/jetbrains
        run: |
          version='${{ github.ref_name }}'
          ./gradlew buildPlugin -PpluginVersion="${version#v}" --console=plain

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.ref_name }}' extensions/jetbrains/build/distributions/*.zip

      - name: Publish to JetBrains Marketplace
        if: env.JETBRAINS_TOKEN != ''
        working-directory: extensions/jetbrains
        run: ./gradlew publishPlugin -PpluginVersion="${GITHUB_REF_NAME#v}" --console=plain

  # Point the Scoop bucket at the new release, then prove it installs.
  scoop-manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Update bucket/portpilot.json
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          gh release download '${{ github.ref_name }}' --pattern SHA256SUMS.txt
          $hash = (Get-Content SHA256SUMS.txt | Where-Object { $_ -match 'portable\.exe$' }).Split(' ')[0]
          $manifest = Get-Content bucket/portpilot.json -Raw | ConvertFrom-Json
          $manifest.version = $version
          $manifest.architecture.'64bit'.url = "https://github.com/${{ github.repository }}/releases/download/v$version/PortPilot-$version-portable.exe#/PortPilot.exe"
          $manifest.architecture.'64bit'.hash = $hash
          $manifest | ConvertTo-Json -Depth 10 | Set-Content bucket/portpilot.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/portpilot.json
          git diff --cached --quiet || (git commit -m "Scoop: PortPilot $version" && git push)

  scoop-test:
    needs: scoop-manifest
    uses: ./.github/workflows/packages.yml

  # Submits the new version to winget. Needs a classic personal access token with the
  # public_repo scope saved as the WINGET_TOKEN repository secret; skipped without it.
  winget:
    needs: release
    runs-on: windows-latest
    env:
      HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Submit to winget-pkgs
        if: env.HAS_TOKEN == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Atrix21.PortPilot
          installers-regex: 'Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "WINGET_TOKEN is not set; submit updates to winget manually."