name: CI

# Only the jobs whose inputs changed run: a README edit runs nothing, an extension change runs only
# the extension job, and so on. A newer push to the same branch cancels the older run.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'Casks/**', 'bucket/**', 'packaging/winget/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'Casks/**', 'bucket/**', 'packaging/winget/**']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      engine: ${{ steps.filter.outputs.engine }}
      desktop: ${{ steps.filter.outputs.desktop }}
      vscode: ${{ steps.filter.outputs.vscode }}
      jetbrains: ${{ steps.filter.outputs.jetbrains }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'src/PortPilot.Core/**'
              - 'src/PortPilot.Presentation/**'
              - 'tests/**'
              - 'Directory.Build.props'
              - 'PortPilot.slnx'
              - '.github/workflows/ci.yml'
            engine:
              - *shared
              - 'src/PortPilot.Cli/**'
            windows:
              - *shared
              - 'src/PortPilot.App/**'
            desktop:
              - *shared
              - 'src/PortPilot.Cli/**'
              - 'src/PortPilot.Desktop/**'
              - 'packaging/linux/**'
              - 'packaging/macos/**'
            vscode:
              - 'extensions/vscode/**'
              - 'src/PortPilot.Core/**'
              - 'src/PortPilot.Cli/**'
              - '.github/workflows/ci.yml'
            jetbrains:
              - 'extensions/jetbrains/**'
              - '.github/workflows/ci.yml'

  build:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/PortPilot.Core.Tests -c Release

      - name: Build app
        run: dotnet build src/PortPilot.App -c Release

  linux:
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/PortPilot.Core.Tests -c Release

      - name: Publish native apps
        run: |
          dotnet publish src/PortPilot.Cli -c Release -r linux-x64 -o out
          dotnet publish src/PortPilot.Desktop -c Release -r linux-x64 -o out

      - name: Smoke test
        run: |
          python3 -c "import socket,time; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('127.0.0.1', 5173)); s.listen(); time.sleep(300)" > server.log 2>&1 &
          for i in $(seq 1 40); do out/portpilot who 5173 >/dev/null && break; sleep 0.5; done
          out/portpilot list
          out/portpilot who 5173 | grep -qi python || {
            echo "::group::Diagnostics"; command -v python3; python3 --version; cat server.log; lsof -nP -iTCP:5173 -sTCP:LISTEN || true; ps -ax -o pid,ppid,command | grep -i "http.server" | grep -v grep || true; echo "::endgroup::"; exit 1; }
          out/portpilot kill 5173 -y

      - name: Desktop app renders
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb libice6 libsm6 libfontconfig1
          xvfb-run -a out/portpilot-desktop --demo --screenshot shots
          ls shots/main-dark.png shots/inspector-light.png

  macos:
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/PortPilot.Core.Tests -c Release

      - name: Publish native apps
        run: |
          dotnet publish src/PortPilot.Cli -c Release -r osx-arm64 -o out
          dotnet publish src/PortPilot.Desktop -c Release -r osx-arm64 -o out

      - name: Smoke test
        run: |
          python3 -c "import socket,time; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('127.0.0.1', 5173)); s.listen(); time.sleep(300)" > server.log 2>&1 &
          for i in $(seq 1 40); do out/portpilot who 5173 >/dev/null && break; sleep 0.5; done
          out/portpilot list
          out/portpilot who 5173 | grep -qi python || {
            echo "::group::Diagnostics"; command -v python3; python3 --version; cat server.log; lsof -nP -iTCP:5173 -sTCP:LISTEN || true; ps -ax -o pid,ppid,command | grep -i "http.server" | grep -v grep || true; echo "::endgroup::"; exit 1; }
          out/portpilot health 5173
          out/portpilot kill 5173 -y

      - name: Bundle
        run: packaging/macos/make-app.sh out 0.0.0-ci osx-arm64 dist

  vscode-extension:
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Build the CLI it drives
        run: dotnet publish src/PortPilot.Cli -c Release -r linux-x64 -o out

      - name: Compile, test in VS Code, package
        working-directory: extensions/vscode
        run: |
          npm ci
          npx tsc -p .
          xvfb-run -a node test/run.js "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/out/portpilot"
          ./package.sh linux-x64 "$GITHUB_WORKSPACE/out/portpilot"

  jetbrains-plugin:
    needs: changes
    if: needs.changes.outputs.jetbrains == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build plugin
        working-directory: extensions/jetbrains
        run: ./gradlew buildPlugin --console=plain
