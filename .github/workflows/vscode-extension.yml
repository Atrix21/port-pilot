name: VS Code extension

# Builds the extension for every platform (each VSIX carries its own native portpilot binary)
# and publishes all of them together to the VS Code Marketplace, and to Open VSX.
#
#   Automatically: the Release workflow starts this for every v* tag.
#   On its own:    gh workflow run vscode-extension.yml -f version=1.0.1
#                  (or push a tag like vscode-v1.0.1) for an extension-only update.
#
# Marketplace authentication is Trusted Publishing (GitHub OIDC): no stored token. It needs a
# policy on https://marketplace.visualstudio.com/manage → Atrix21 → Trusted Publishing for
# owner Atrix21, repository port-pilot, workflow vscode-extension.yml. This must stay a
# standalone workflow (not workflow_call), so the OIDC token always names this file.
# Open VSX (Cursor, Windsurf, VSCodium) uses the optional OVSX_PAT secret.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Extension version, e.g. 1.0.1
        required: true
      release-tag:
        description: Also attach the VSIX files to this GitHub release (optional)
        default: ''
      pre-release:
        description: Publish as a pre-release
        type: boolean
        default: false
      from-run:
        description: Publish the VSIX files built by this earlier run (its ID) instead of building again
        default: ''
      diagnose:
        description: Only report each published version's Marketplace status (validation results); build and publish nothing
        type: boolean
        default: false
  push:
    tags: ['vscode-v*']

permissions:
  contents: read
  actions: read   # download artifacts from an earlier run (from-run)

jobs:
  package:
    if: ${{ !inputs.from-run && !inputs.diagnose }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64, rid: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, rid: osx-arm64, runner: macos-latest }
          - { target: darwin-x64, rid: osx-x64, runner: macos-15-intel }
          - { target: win32-x64, rid: win-x64, runner: windows-latest }
          - { target: win32-arm64, rid: win-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        run: |
          v='${{ inputs.version }}'
          [ -z "$v" ] && v="${GITHUB_REF_NAME#vscode-v}"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Package
        shell: bash
        run: |
          dotnet publish src/PortPilot.Cli -c Release -r ${{ matrix.rid }} -p:Version=${{ steps.version.outputs.version }} -o out
          exe=out/portpilot; [ -f out/portpilot.exe ] && exe=out/portpilot.exe
          extensions/vscode/package.sh ${{ matrix.target }} "$PWD/$exe" "${{ steps.version.outputs.version }}"

      - name: Smoke test the bundled binary
        shell: bash
        run: extensions/vscode/bin/portpilot* list --json > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: extensions/vscode/portpilot-${{ matrix.target }}.vsix

  publish:
    needs: package
    # Runs after a fresh build, or straight away when publishing an earlier run's files.
    if: ${{ !cancelled() && !inputs.diagnose && (needs.package.result == 'success' || (needs.package.result == 'skipped' && inputs.from-run)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach to the GitHub release
      id-token: write   # Marketplace Trusted Publishing
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      PRE_RELEASE: ${{ inputs.pre-release && '--pre-release' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: extensions/vscode/package.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix
          run-id: ${{ inputs.from-run || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: ls -l vsix

      - name: Attach to the GitHub release
        if: inputs.release-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ inputs.release-tag }}' vsix/*.vsix --repo '${{ github.repository }}' --clobber

      - name: Publish to the VS Code Marketplace (Trusted Publishing)
        run: npx --yes @vscode/vsce@^4.1.1 publish --oidc --skip-duplicate $PRE_RELEASE --packagePath vsix/*.vsix

      # Open VSX: trusted publishing once the namespace has an owner who registered this workflow
      # (set repository variable OPENVSX_TRUSTED_PUBLISHING=true), otherwise the OVSX_PAT token.
      - name: Publish to Open VSX (Cursor, Windsurf, VSCodium)
        if: env.OVSX_PAT != '' || vars.OPENVSX_TRUSTED_PUBLISHING == 'true'
        env:
          TRUSTED: ${{ vars.OPENVSX_TRUSTED_PUBLISHING == 'true' }}
        run: |
          namespace=$(node -p "require('./extensions/vscode/package.json').publisher")
          if [ "$TRUSTED" = "true" ]; then
            auth="--trusted-publishing"
            unset OVSX_PAT
          else
            # Creating the namespace is a one-time step; it fails harmlessly once it exists.
            npx --yes ovsx@^1.4.0 create-namespace "$namespace" || true
            auth=""
          fi
          for f in vsix/*.vsix; do npx --yes ovsx@^1.4.0 publish "$f" --skip-duplicate $PRE_RELEASE $auth; done

  # What the Marketplace says about each published version and platform, including validation
  # results that only the publisher can see. Authenticates the same way as publishing (OIDC).
  diagnose:
    if: ${{ inputs.diagnose }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Marketplace status
        env:
          PUBLISHER: Atrix21
          EXTENSION: portpilot-dev
        run: |
          node - <<'JS'
          const env = process.env;
          const oidcUrl = new URL(env.ACTIONS_ID_TOKEN_REQUEST_URL);
          oidcUrl.searchParams.set("audience", "marketplace.visualstudio.com");
          const oidc = await (await fetch(oidcUrl, { headers: { Authorization: `Bearer ${env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` } })).json();
          const exchange = await fetch("https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1", {
            method: "POST",
            headers: { Authorization: `FederatedToken ${oidc.value}`, "Content-Type": "application/json", Accept: "application/json", "User-Agent": "vsce" },
            body: JSON.stringify({ publisherName: env.PUBLISHER }),
          });
          const { credential } = await exchange.json();
          const auth = "Basic " + Buffer.from(`OAuth:${credential}`).toString("base64");
          // IncludeVersions | IncludeFiles | IncludeVersionProperties | IncludeInstallationTargets | IncludeAssetUri | IncludeStatistics
          const url = `https://marketplace.visualstudio.com/_apis/gallery/publishers/${env.PUBLISHER}/extensions/${env.EXTENSION}?flags=${1 | 2 | 16 | 64 | 128 | 256}&api-version=7.2-preview.1`;
          const response = await fetch(url, { headers: { Authorization: auth, Accept: "application/json" } });
          const ext = await response.json();
          console.log(`${response.status} ${ext.displayName ?? ""} flags=${ext.flags}`);
          for (const v of ext.versions ?? []) {
            console.log(`\n${v.version} ${v.targetPlatform ?? "universal"}  flags=${v.flags}  updated=${v.lastUpdated}`);
            if (v.validationResultMessage) console.log(`  validation: ${v.validationResultMessage}`);
            for (const p of v.properties ?? []) {
              if (/valid|scan|error|reject|status|message/i.test(p.key)) console.log(`  ${p.key} = ${p.value}`);
            }
          }
          JS

